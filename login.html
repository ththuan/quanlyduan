<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060d1f">
  <title>Phần mềm Quản lý dự án | Trường Cao đẳng Kinh tế - Kỹ thuật Cần Thơ</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="logoCTEC.png">
  <link rel="apple-touch-icon" href="logoCTEC.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      min-height: 100svh;
      background: linear-gradient(135deg, #060d1f 0%, #0a1a35 40%, #0d2145 70%, #091828 100%);
      color: #1e293b;
      overflow: hidden;
    }

    .login-container {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .login-center {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 32px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .form-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px 32px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .school-logo {
      height: 72px;
      width: 72px;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
      box-shadow: 0 0 0 3px #e2e8f0, 0 8px 20px rgba(0,0,0,0.08);
      object-fit: contain;
    }

    .sub-welcome {
      color: #1e293b;
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 4px;
      line-height: 1.5;
    }

    .school-name {
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 400;
      margin: 0 0 28px;
      line-height: 1.4;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-weight: 600;
      color: #1e293b;
      font-size: 0.9rem;
      padding-bottom: 6px;
    }
    .form-label .required { color: #dc2626; font-weight: 700; margin-right: 2px; }

    .field-hint {
      font-size: 0.72rem;
      color: #94a3b8;
      margin: 4px 0 0 0;
      line-height: 1.4;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 20px;
      pointer-events: none;
    }
    .input-field {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      color: #1e293b;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .input-field::placeholder { color: #94a3b8; }
    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      background: #fff;
    }
    .pw-field { padding-right: 44px; }

    .toggle-pw {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: #475569; }
    .toggle-pw .material-symbols-rounded { font-size: 20px; }

    /* Remember + forgot row */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: -6px 0 20px;
    }
    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: #64748b;
      cursor: pointer;
      user-select: none;
    }
    .remember-wrap input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer;
    }

    .forgot-link {
      background: none; border: none;
      color: #94a3b8; font-size: 0.8rem; font-family: inherit;
      cursor: pointer; padding: 4px 0;
      display: flex; align-items: center; gap: 4px;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: #3b82f6; }
    .forgot-link .material-symbols-rounded { font-size: 16px; }

    .admin-help {
      display: none;
      padding: 10px 14px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #1e293b;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .admin-help.show { display: block; }
    .admin-help strong { color: #2563eb; }
    .admin-help .phone { font-weight: 700; }

    /* Error */
    .login-error {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 10px; font-size: 0.82rem; color: #dc2626;
      margin-bottom: 16px; animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-6px); }
      40%, 80%  { transform: translateX(6px); }
    }
    .login-error .material-symbols-rounded { font-size: 16px; flex-shrink: 0; }

    /* Submit */
    .btn-login {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: none;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .form-card { padding: 28px 20px 24px; border-radius: 16px; }
      .school-logo { height: 60px; width: 60px; }
      .sub-welcome { font-size: 0.875rem; margin-bottom: 20px; }
      .btn-login { height: 44px; font-size: 0.95rem; }
      .login-footer { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<div class="login-container">
  <canvas id="particle-canvas"></canvas>

  <div class="login-center">
    <div class="form-card">

      <div class="login-header">
        <div class="logo-wrapper">
          <img src="logoCTEC.png" alt="Logo CTEC" class="school-logo" onerror="this.style.display='none'">
        </div>
        <p class="sub-welcome">Phần mềm Quản lý Dự án</p>
        <p class="school-name">Trường Cao đẳng Kinh tế - Kỹ thuật Cần Thơ</p>
      </div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="f-username"><span class="required">*</span> Tên đăng nhập</label>
          <div class="input-wrap">
            <span class="material-symbols-rounded input-icon">person</span>
            <input class="input-field" type="text" id="f-username" placeholder="Nhập tên đăng nhập"
                   autocomplete="username" required autofocus>
          </div>
          <p class="field-hint">Vui lòng nhập tên đăng nhập</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="f-password"><span class="required">*</span> Mật khẩu</label>
          <div class="input-wrap">
            <span class="material-symbols-rounded input-icon">lock</span>
            <input class="input-field pw-field" type="password" id="f-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
                   autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="toggle-pw" title="Hiện/ẩn mật khẩu">
              <span class="material-symbols-rounded" id="toggle-pw-icon">visibility</span>
            </button>
          </div>
          <p class="field-hint">Vui lòng nhập mật khẩu</p>
        </div>

        <div class="form-row">
          <label class="remember-wrap">
            <input type="checkbox" id="remember-me">
            <span>Ghi nhớ phiên đăng nhập</span>
          </label>
          <button type="button" class="forgot-link" id="forgot-link">
            <span class="material-symbols-rounded">help_outline</span>
            Quên mật khẩu?
          </button>
        </div>

        <div id="admin-help" class="admin-help" role="status">
          <strong>Liên hệ Admin để được hỗ trợ:</strong><br>
          Trần Thuận - <span class="phone">0944 300 848</span>
        </div>

        <div id="login-error" class="login-error hidden" role="alert">
          <span class="material-symbols-rounded">error</span>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          Đăng nhập ngay
        </button>

      </form>

      <div class="login-footer">
        <p>&copy; 2026 Trường Cao đẳng Kinh tế - Kỹ thuật Cần Thơ</p>
      </div>

    </div>
  </div>
</div>

<script>
/* ---- Canvas particle network ---- */
(function() {
  var cv = document.getElementById('particle-canvas');
  var ctx = cv.getContext('2d');
  var w, h;
  var COUNT = 100;
  var MAX_DIST = 140;
  var particles = [];

  function resize() { w = cv.width = window.innerWidth; h = cv.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  for (var i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      r: Math.random() * 1.8 + 0.5,
      alpha: Math.random() * 0.55 + 0.25
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180, 210, 255, ' + p.alpha + ')';
      ctx.fill();
    }
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(100, 180, 255, ' + ((1 - dist / MAX_DIST) * 0.28) + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---- Auth ---- */
(function() {
  if (window.location.search.includes('timeout')) return;
  var res = fetch('/api/me').then(function(r) { if (r.ok) window.location.href = '/'; }).catch(function() {});
})();

/* ---- Toggle password ---- */
document.getElementById('toggle-pw').addEventListener('click', function() {
  var pw = document.getElementById('f-password');
  var icon = document.getElementById('toggle-pw-icon');
  if (pw.type === 'password') { pw.type = 'text'; icon.textContent = 'visibility_off'; }
  else { pw.type = 'password'; icon.textContent = 'visibility'; }
});

/* ---- Forgot password ---- */
document.getElementById('forgot-link').addEventListener('click', function() {
  document.getElementById('admin-help').classList.toggle('show');
});

/* ---- Submit ---- */
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var username = document.getElementById('f-username').value.trim();
  var password = document.getElementById('f-password').value;
  var errorEl = document.getElementById('login-error');
  var errorText = document.getElementById('login-error-text');
  var btn = document.getElementById('btn-login');

  errorEl.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Đang xử lý...';

  function showError(msg) {
    errorText.textContent = msg;
    errorEl.classList.remove('hidden');
    errorEl.style.animation = 'none';
    errorEl.offsetHeight;
    errorEl.style.animation = '';
  }

  function resetBtn() {
    btn.disabled = false;
    btn.innerHTML = 'Đăng nhập ngay';
  }

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  }).then(function(res) {
    return res.json().catch(function() { return {}; }).then(function(data) {
      return { ok: res.ok, data: data };
    });
  }).then(function(result) {
    if (!result.ok) {
      showError(result.data.error || 'Sai tên đăng nhập hoặc mật khẩu');
      resetBtn();
      document.getElementById('f-password').value = '';
      document.getElementById('f-password').focus();
      return;
    }
    if (result.data.mustChangePassword) {
      sessionStorage.setItem('qlda_force_pw', JSON.stringify({ id: result.data.id, username: result.data.username }));
    }
    btn.innerHTML = 'Thành công!';
    setTimeout(function() { window.location.href = '/'; }, 400);
  }).catch(function() {
    showError('Không thể kết nối máy chủ. Vui lòng thử lại.');
    resetBtn();
  });
});
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js')</script>

</body>
</html>
