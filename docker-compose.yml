# ============================================================
# QLDA - Cloudflare Tunnel (domain cố định + miễn phí trọn đời)
# Domain: qlda-ctec.us.kg qua Cloudflare Zero Trust
# ============================================================
services:
  qlda:
    build: .
    image: qlda:latest
    container_name: qlda
    restart: unless-stopped
    ports:
      - "${QLDA_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-6}
      - MONITOR_SECRET=${MONITOR_SECRET:-qlda-internal-monitor}
    volumes:
      - qlda_data:/app/server/data
      - qlda_uploads:/app/server/uploads
    networks:
      - qlda_net

  van-phong-ai:
    build: ./VAN-PHONG-AI
    image: van-phong-ai:latest
    container_name: van-phong-ai
    restart: unless-stopped
    environment:
      - AI_OFFICE_PORT=8765
      - AI_OFFICE_HOST=0.0.0.0
      - AI_OFFICE_NO_OPEN=1
      - QLDA_URL=http://qlda:3000
      - MONITOR_SECRET=${MONITOR_SECRET:-qlda-internal-monitor}
    volumes:
      - van_phong_dossiers:/app/HO-SO-AI
      - van_phong_kb:/app/KHO-TRI-THUC
      # Cấu hình AI (chứa API key) — tạo file này trên server rồi bỏ comment:
      # - ./VAN-PHONG-AI/ai-config.local.json:/app/ai-config.local.json:ro
    networks:
      - qlda_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qlda-tunnel
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - qlda
    networks:
      - qlda_net

volumes:
  qlda_data:
  qlda_uploads:
  van_phong_dossiers:
  van_phong_kb:

networks:
  qlda_net:
    driver: bridge