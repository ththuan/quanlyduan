# ============================================================
# QLDA - Cloudflare Tunnel (domain cố định + miễn phí trọn đời)
# Domain: qlda-ctec.us.kg qua Cloudflare Zero Trust
# ============================================================
services:
  qlda:
    build: .
    image: qlda:latest
    container_name: qlda
    restart: unless-stopped
    ports:
      - "${QLDA_BIND_IP:-0.0.0.0}:${QLDA_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-6}
      # AI: chọn nhà cung cấp (gemini hoặc openai-compatible)
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      # Tương thích ngược với Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Kết nối phần mềm Quản lý tài sản (QLTS)
      - QLTS_API_URL=${QLTS_API_URL:-https://quanlytaisanctec.dpdns.org/api}
      - QLTS_USERNAME=${QLTS_USERNAME:-}
      - QLTS_PASSWORD=${QLTS_PASSWORD:-}
    volumes:
      - qlda_data:/app/server/data
      - qlda_uploads:/app/server/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 256
    networks:
      - qlda_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qlda-tunnel
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - qlda
    networks:
      - qlda_net

volumes:
  qlda_data:
  qlda_uploads:

networks:
  qlda_net:
    driver: bridge
